# AI Workspace — nginx reverse proxy (terminal TLS + SSE-safe upstream).
# Install to /etc/nginx/sites-available/ai-workspace and symlink into sites-enabled.
#
# Why this file exists: the app speaks SSE on /api/chat/stream and accepts 50 MB
# uploads, and it has NO authentication layer of its own (single-user demo build,
# BUILD_REVIEW §3). nginx therefore owns TLS, body limits, streaming passthrough and —
# until the app gains auth — the only access control. Do not expose :3000 publicly.

upstream ai_workspace {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    # HTTP -> HTTPS (plan §28.1: LB terminates TLS 1.2+, redirects cleartext)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.example.com;

    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Uploads: server.js caps bodies at 50 MB; leave nginx headroom so the app's
    # own 413 message is what the user sees.
    client_max_body_size 51m;
    client_body_timeout 120s;

    access_log /var/log/nginx/ai-workspace.access.log;
    error_log  /var/log/nginx/ai-workspace.error.log warn;

    # --- Gate the whole app until it has auth (comment out when it does) ---
    auth_basic "AI Workspace";
    auth_basic_user_file /etc/nginx/.ai-workspace-htpasswd;

    location / {
        proxy_pass http://ai_workspace;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering on;
    }

    # Streaming chat: buffering off + long read timeout, or SSE stalls/drops.
    location /api/chat/stream {
        # auth_basic is inherited from the server block on purpose: streaming
        # chat must not be more open than the rest of the app.
        proxy_pass http://ai_workspace;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Health probes — never behind the password gate, never public.
    location /api/health/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;      # OCI LB / VCN range — tighten to your NSG CIDR
        deny all;
        access_log off;
        proxy_pass http://ai_workspace;
        proxy_http_version 1.1;
    }
}
