# Local + single-VM runner for the zero-dependency Node build.
#   docker compose up --build -d      → http://localhost:3000
#   docker compose logs -f web
#   docker compose down
#
# The named volume is not optional housekeeping: ./data holds the JSON store AND
# data/master.key, which decrypts every saved provider key. Recreate the
# container without the volume and the vault is unrecoverable.
#
# To keep the data on a bind mount instead (easier backups on a VM):
#   install -d -m 0700 -o 10001 -g 10001 ./data
#   volumes: [ "./data:/app/data" ]
# (the image runs as uid/gid 10001 — pinned in the Dockerfile for exactly this)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_VERSION: ${BUILD_VERSION:-compose}
    image: ${IMAGE:-ai-workspace:local}
    container_name: ai-workspace
    ports:
      - "${PUBLISHED_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      # --- security (see SECURITY.md / .env.example) ---
      # REQUIRED in any real deployment. Without it the server generates a new
      # token on every boot, so a redeploy silently locks everyone out.
      # Generate: openssl rand -base64 32
      APP_TOKEN: ${APP_TOKEN:?APP_TOKEN is required - generate with: openssl rand -base64 32}
      # 64-hex key for the credential vault. Without it the key lives in the
      # data volume next to the ciphertext it protects.
      MASTER_KEY: ${MASTER_KEY:-}
      # Set true ONLY when a trusted reverse proxy sets X-Forwarded-For,
      # otherwise every client shares one rate-limit bucket.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FORCE_HSTS: ${FORCE_HSTS:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
    volumes:
      - ai-workspace-data:/app/data
    restart: unless-stopped
    init: true                # reap orphan processes; SIGTERM still reaches node
    stop_grace_period: 15s    # server.js persists the store, then exits (3s cap)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Unprivileged: no capability grants, no host paths. Outbound access the app
    # actually needs is 443/tcp to the provider APIs + api.github.com.
    security_opt:
      - no-new-privileges:true
