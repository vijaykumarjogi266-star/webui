<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workspace</title>
<link rel="stylesheet" href="/index.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">A</span> AI Workspace</div>
    <button class="nav-item active" data-view="chat" id="nav-chat"></button>
    <button class="nav-item" data-view="files" id="nav-files"></button>
    <button class="nav-item" data-view="github" id="nav-github"></button>
    <button class="nav-item" data-view="feedback" id="nav-feedback"></button>
    <button class="nav-item" data-view="usage" id="nav-usage"></button>
    <button class="nav-item" data-view="settings" id="nav-settings"></button>
    <div class="spacer"></div>
    <div class="side-foot">
      <button class="nav-item" id="theme-toggle"></button>
      <div class="faint" style="padding:6px 10px;font-size:11px">Demo build · keys stay on this server, encrypted</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="/index.js" defer></script>
</body>
</html>
